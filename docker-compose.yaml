services:
    mongo:
        image: mongo:7
        container_name: erc8004-mongo
        restart: unless-stopped
        ports:
            - "27018:27017"
        volumes:
            - mongo_data:/data/db
            - ./scripts/mongo-init:/docker-entrypoint-initdb.d:ro
        environment:
            MONGO_INITDB_DATABASE: erc8004
        healthcheck:
            test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 15s
        command: ["mongod", "--quiet", "--bind_ip_all", "--logpath", "/dev/null"]

    rabbitmq:
        image: rabbitmq:3-management-alpine
        container_name: erc8004-rabbitmq
        restart: unless-stopped
        ports:
            - "5672:5672"
            - "15672:15672"
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 20s

    redis:
        image: redis:7-alpine
        container_name: erc8004-redis
        restart: unless-stopped
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5

    indexer:
        build:
            context: .
            dockerfile: Dockerfile
            target: indexer
        image: erc8004-indexer:latest
        container_name: erc8004-indexer
        restart: unless-stopped
        depends_on:
            mongo:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        env_file:
            - .env
        environment:
            MONGO_URI: mongodb://mongo:27017
            RABBITMQ_URI: amqp://guest:guest@rabbitmq:5672/

    consumer:
        build:
            context: .
            dockerfile: Dockerfile
            target: consumer
        image: erc8004-consumer:latest
        container_name: erc8004-consumer
        restart: unless-stopped
        stop_grace_period: 3m
        depends_on:
            mongo:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            redis:
                condition: service_healthy
        env_file:
            - .env
        environment:
            MONGO_URI: mongodb://mongo:27017
            RABBITMQ_URI: amqp://guest:guest@rabbitmq:5672/
            REDIS_URL: redis://redis:6379/0

    api:
        build:
            context: .
            dockerfile: Dockerfile
            target: api
        image: erc8004-api:latest
        container_name: erc8004-api
        restart: unless-stopped
        depends_on:
            mongo:
                condition: service_healthy
            redis:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        env_file:
            - .env
        environment:
            MONGO_URI: mongodb://mongo:27017
            REDIS_URL: redis://redis:6379/0
            RABBITMQ_URI: amqp://guest:guest@rabbitmq:5672/
        ports:
            - "8080:8080"

    trustrank-worker:
        build:
            context: .
            dockerfile: Dockerfile
            target: trustrank-worker
        image: erc8004-trustrank-worker:latest
        container_name: erc8004-trustrank-worker
        restart: unless-stopped
        stop_grace_period: 3m
        depends_on:
            mongo:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        env_file:
            - .env
        environment:
            MONGO_URI: mongodb://mongo:27017
            RABBITMQ_URI: amqp://guest:guest@rabbitmq:5672/

    score-worker:
        build:
            context: .
            dockerfile: Dockerfile
            target: score-worker
        image: erc8004-score-worker:latest
        container_name: erc8004-score-worker
        restart: unless-stopped
        depends_on:
            mongo:
                condition: service_healthy
        env_file:
            - .env
        environment:
            MONGO_URI: mongodb://mongo:27017

    rescale-worker:
        build:
            context: .
            dockerfile: Dockerfile
            target: rescale-worker
        image: erc8004-rescale-worker:latest
        container_name: erc8004-rescale-worker
        restart: unless-stopped
        depends_on:
            mongo:
                condition: service_healthy
        env_file:
            - .env
        environment:
            MONGO_URI: mongodb://mongo:27017

    uri-resolver:
        build:
            context: .
            dockerfile: Dockerfile
            target: uri-bootstrap
        image: erc8004-uri-resolver:latest
        container_name: erc8004-uri-resolver
        restart: unless-stopped
        stop_grace_period: 3m
        depends_on:
            mongo:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        env_file:
            - .env
        environment:
            MONGO_URI: mongodb://mongo:27017
            RABBITMQ_URI: amqp://guest:guest@rabbitmq:5672/

    trust-graph-updater:
        build:
            context: .
            dockerfile: Dockerfile
            target: trust-graph-updater
        image: erc8004-trust-graph-updater:latest
        container_name: erc8004-trust-graph-updater
        restart: unless-stopped
        stop_grace_period: 3m
        depends_on:
            mongo:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        env_file:
            - .env
        environment:
            MONGO_URI: mongodb://mongo:27017
            RABBITMQ_URI: amqp://guest:guest@rabbitmq:5672/

    trustrank-pass:
        build:
            context: .
            dockerfile: Dockerfile
            target: trustrank-pass
        image: erc8004-trustrank-pass:latest
        container_name: erc8004-trustrank-pass
        restart: unless-stopped
        depends_on:
            mongo:
                condition: service_healthy
        env_file:
            - .env
        environment:
            MONGO_URI: mongodb://mongo:27017

